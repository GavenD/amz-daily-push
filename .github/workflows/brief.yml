name: Amazon US Daily Brief

on:
  schedule:
    - cron: '5 0 * * *'   # 每天 UTC 0:05 = 北京时间 8:05
  workflow_dispatch:      # 允许在 Actions 页面手动运行

permissions:
  contents: write         # 允许工作流提交已推送记录

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure data directory
        run: mkdir -p data

      - name: Run brief
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          LOOKBACK_DAYS: '7'
        run: python amz_brief.py

      - name: Commit sent records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent.json
          git diff --staged --quiet || git commit -m "chore: update sent records"
          git push
